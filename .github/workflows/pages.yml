# Deploy Quantum Resonance (static React client) to GitHub Pages.
# Repo: chaishillomnitech1/quantum-resonance (create via browser — the GitHub
# connector cannot create repos). Push the whole source tree, then in the repo
# Settings → Pages → Build and deployment → Source: GitHub Actions.
# The workflow builds ONLY the client (`npx vite build`); the Express server is
# not deployed. The dashboard renders with empty data states (layers/nodes/
# simulations show 0) and the built-in mock coherence chart — no API on Pages.
name: Deploy Quantum Resonance to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vite build
      - run: touch dist/public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
